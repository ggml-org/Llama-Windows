name: Release

# Triggered by version tags (v1.2.3). Tests + builds per-architecture MSIX via
# the shared reusable pipeline (_build.yml — same jobs CI runs, plus stamping
# the package version from the tag), then signs them, bundles them into a
# single .msixbundle, signs the bundle, and attaches everything to a GitHub
# Release (auto-generated notes).
#
# Signing uses Azure Trusted Signing. Required repo secrets:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT_NAME, AZURE_TS_PROFILE_NAME
#
# NOTE: the Publisher in Package.appxmanifest MUST exactly match the subject of
# the certificate issued by your Trusted Signing certificate profile, otherwise
# the MSIX signature is invalid and install will fail.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release & upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    uses: ./.github/workflows/_build.yml
    with:
      # Stamp the MSIX identity version from the tag (a non-version ref, e.g.
      # manual dispatch from a branch, keeps the committed manifest version).
      tag: ${{ github.ref_name }}

  sign:
    name: Sign MSIX (Trusted Signing, ${{ matrix.rid }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
          - rid: win-arm64
    steps:
      - name: Download unsigned MSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-unsigned-${{ matrix.rid }}-${{ github.sha }}
          path: unsigned/${{ matrix.rid }}

      - name: Sign MSIX (Azure Trusted Signing)
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT_NAME }}
          certificate-profile-name:     ${{ secrets.AZURE_TS_PROFILE_NAME }}
          files-folder:                 unsigned/${{ matrix.rid }}
          files-folder-filter:          msix
          files-folder-recurse:         false
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com/
          timestamp-digest:             SHA256

      - name: Upload signed MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LlamaApp-msix-${{ matrix.rid }}-${{ github.sha }}
          path: unsigned/${{ matrix.rid }}/**/*.msix
          if-no-files-found: error

  bundle:
    name: Create & sign .msixbundle
    needs: sign
    runs-on: windows-latest
    steps:
      - name: Download signed MSIX (all architectures)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: LlamaApp-msix-*-${{ github.sha }}
          path: signed
          merge-multiple: true

      - name: Locate MakeAppx.exe
        id: makeappx
        shell: pwsh
        run: |
          # Pick the highest-versioned makeappx.exe from the Windows SDK bin
          # tree (windows-latest ships several side-by-side).
          $exe = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            Get-ChildItem -Path { $_.FullName } -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if (-not $exe) { throw "makeappx.exe not found under Windows Kits" }
          Write-Host "Using: $($exe.FullName)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build .msixbundle
        shell: pwsh
        env:
          # Via env, never ${{ }}-interpolated into the script body: a tag
          # name is attacker-controllable (anyone who can push tags) and
          # would otherwise be injected verbatim into this PowerShell block.
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force bundle-input,bundle | Out-Null
          Get-ChildItem signed -Recurse -Filter *.msix |
            Copy-Item -Destination bundle-input
          & "${{ steps.makeappx.outputs.path }}" bundle /d bundle-input /p "bundle/LlamaApp-${env:TAG}.msixbundle" /v

      - name: Sign .msixbundle (Azure Trusted Signing)
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT_NAME }}
          certificate-profile-name:     ${{ secrets.AZURE_TS_PROFILE_NAME }}
          files-folder:                 bundle
          files-folder-filter:          msixbundle
          files-folder-recurse:         false
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com/
          timestamp-digest:             SHA256

      - name: Upload .msixbundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LlamaApp-msixbundle-${{ github.sha }}
          path: bundle/*.msixbundle
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: LlamaApp-msix*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle

  # Publishes the signed .msixbundle to the Microsoft Store (Partner Center
  # submission) — "publish to the Store from the GitHub Release": this runs
  # after the release is created, version tags only. One-time setup is
  # documented in docs/store-publishing.md (Partner Center app reservation,
  # Entra app for the submission API, secrets, and the environment gate).
  store:
    name: Publish to Microsoft Store
    needs: release
    # Version tags only — a manual dispatch from a branch must never submit.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Human gate: add required reviewers to the "microsoft-store" environment
    # in repo settings so every Store submission gets a go-ahead before it
    # enters certification.
    environment: microsoft-store
    steps:
      - name: Download the signed .msixbundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LlamaApp-msixbundle-${{ github.sha }}
          path: store

      # Official setup action for the MSStore Developer CLI — it installs
      # the CLI the supported way (its own version governs which CLI lands
      # on the runner). Pinned to a commit SHA like every other action here.
      - name: Set up the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      # msstore's officially supported non-interactive configuration:
      # reconfigure stores the Partner Center identity and the Entra client
      # secret for all later msstore commands on this runner.
      - name: Configure Partner Center credentials
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if (-not $env:PARTNER_CENTER_SELLER_ID -or -not $env:PARTNER_CENTER_CLIENT_SECRET) {
            throw 'PARTNER_CENTER_* secrets are not configured — see docs/store-publishing.md'
          }
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET

      # Commits the submission to certification. First integrations: set the
      # repo variable STORE_NO_COMMIT=true to keep the submission as a draft
      # in Partner Center for review instead (see docs/store-publishing.md).
      - name: Publish submission to Partner Center
        shell: pwsh
        env:
          PARTNER_CENTER_APP_ID: ${{ secrets.PARTNER_CENTER_APP_ID }}
        run: |
          $extra = if ('${{ vars.STORE_NO_COMMIT }}' -eq 'true') { '--noCommit' } else { '' }
          $bundle = Get-ChildItem store -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw 'signed .msixbundle artifact not found in store/' }
          msstore publish $bundle.FullName --appId $env:PARTNER_CENTER_APP_ID $extra
