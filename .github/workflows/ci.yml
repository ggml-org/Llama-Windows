name: CI

# Continuous integration: build & test on every push/PR to main.
# Produces UNSIGNED MSIX artifacts for review. Signing only happens in
# release.yml (on version tags) to conserve the Trusted Signing quota and to
# keep signing secrets away from forked PR builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
          - label: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Restore (test project)
        run: dotnet restore LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj

      - name: Build (test project + dependencies)
        run: dotnet build LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  build:
    name: Build MSIX (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            runner: windows-latest
          - rid: win-x86
            platform: x86
            runner: windows-latest
          - rid: win-arm64
            platform: ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuget-

      # Generate the unsigned MSIX. For a WinUI 3 single-project MSIX app,
      # `dotnet publish` does NOT run the GenerateAppxPackage target — it only
      # does a loose-file publish. MSIX packaging must be driven by msbuild
      # `-t:Build` with GenerateAppxPackage=true (the documented CI approach).
      # Restore + build + package happen in a single msbuild invocation.
      - name: Build & package unsigned MSIX (${{ matrix.rid }})
        run: >
          dotnet msbuild LlamaApp.csproj
          -t:Build -restore -bl:msbuild.binlog
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:RuntimeIdentifier=${{ matrix.rid }}
          -p:GenerateAppxPackage=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}/packages/${{ matrix.rid }}/
          -p:PublishDir=${{ github.workspace }}/publish/${{ matrix.rid }}/

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: msix-unsigned-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ github.workspace }}/packages/${{ matrix.rid }}
          if-no-files-found: error

      - name: Upload MSBuild binlog (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-binlog-${{ matrix.rid }}-${{ github.sha }}
          path: msbuild.binlog
          if-no-files-found: warn