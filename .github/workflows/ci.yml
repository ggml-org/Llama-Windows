name: CI

# Continuous integration: build & test on every push/PR to main.
# Produces UNSIGNED MSIX artifacts for review. Signing only happens in
# release.yml (on version tags) to conserve the Trusted Signing quota and to
# keep signing secrets away from forked PR builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
          - label: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Restore (test project)
        run: dotnet restore LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj

      - name: Build (test project + dependencies)
        run: dotnet build LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test LlamaApp.LlamaCpp.Tests/LlamaApp.LlamaCpp.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  build:
    name: Build MSIX (${{ matrix.rid }})
    runs-on: windows-latest   # VS MSBuild + ARM64 cross-pack on x64 host is fine
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-x86
            platform: x86
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Single-project MSIX packaging (GenerateAppxPackage) is only wired into
      # the Build target chain by Visual Studio's MSBuild — `dotnet msbuild`
      # compiles the assemblies but never triggers the Appx pack target, so no
      # .msix is produced. Use setup-msbuild to put VS msbuild on PATH.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: windows-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: windows-nuget-

      # Restore + build + package in one msbuild invocation.
      # GenerateAppxPackageOnBuild=true is the actual switch that fires the
      # `GenerateMsixPackage` target (which runs MakeAppx via
      # `_GenerateAppxPackageFile`). The legacy `GenerateAppxPackage=true` is a
      # no-op passthrough in WinAppSDK 1.6 and produces NO .msix.
      # PublishTrimmed/PublishReadyToRun are forced off because the app uses
      # reflection-based JsonSerializer.Deserialize<TValue> and `dynamic`
      # (StartupHelper) which trim/R2R would remove -> runtime breakage.
      - name: Build & package unsigned MSIX (${{ matrix.rid }})
        run: >
          msbuild LlamaApp.csproj
          -t:Build -restore -bl:msbuild.binlog
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:RuntimeIdentifier=${{ matrix.rid }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:PublishSingleFile=false
          -p:AppxPackageDir=${{ github.workspace }}/packages/${{ matrix.rid }}/
          
      - name: Locate MakeAppx
        id: makeappx
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\MakeAppx.exe" |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1 -ExpandProperty FullName
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: msix-unsigned-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ github.workspace }}/packages/${{ matrix.rid }}
          if-no-files-found: error

      - name: Upload MSBuild binlog (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-binlog-${{ matrix.rid }}-${{ github.sha }}
          path: msbuild.binlog
          if-no-files-found: warn