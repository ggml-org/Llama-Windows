name: Publish

# Manual, on-demand publish of loose-file (non-MSIX) zip builds per
# architecture — a debugging/inspection artifact, NOT the release channel.
#
# Intentionally workflow_dispatch-only: version tags are owned by release.yml
# (signed MSIX bundle). Previously both workflows triggered on 'v*' tags and
# BOTH created a GitHub Release on the same tag — racing to attach unsigned
# zips vs the signed bundle to the same release.

on:
  workflow_dispatch:
    inputs:
      self-contained:
        description: 'Self-contained publish (bundle .NET runtime)'
        type: boolean
        default: true
      make-release:
        description: 'Create/update a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      # Action refs are pinned to commit SHAs (same pins as
      # _build.yml/release.yml) — a moved tag can't inject code into a
      # workflow that holds contents:write and creates releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: >
          dotnet restore LlamaApp.csproj
          -p:RuntimeIdentifier=${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:RestoreLockedMode=true

      # PublishTrimmed/PublishReadyToRun are forced off (mirroring the MSIX
      # build in _build.yml): the app uses reflection-based
      # JsonSerializer.Deserialize<TValue> and `dynamic` (StartupHelper),
      # which trim/R2R break — and the WindowsAppSDK self-contained defaults
      # would otherwise switch BOTH on for exactly these zip builds.
      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish LlamaApp.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained ${{ inputs.self-contained }}
          -p:Platform=${{ matrix.platform }}
          -p:RestoreLockedMode=true
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: Compress artifact
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $dest = "LlamaApp-$rid"
          Compress-Archive -Path "publish/$rid/*" -DestinationPath "$dest.zip" -Force
          Get-Item "$dest.zip" | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LlamaApp-${{ matrix.rid }}
          path: LlamaApp-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: inputs.make-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all publish artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: LlamaApp-win-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
