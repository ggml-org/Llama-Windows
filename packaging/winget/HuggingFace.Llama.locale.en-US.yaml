# them across version bumps. See README.md before the first submission.
PackageIdentifier: HuggingFace.Llama
PackageVersion: 0.12.0
PackageLocale: en-US
Publisher: Hugging Face
PackageName: Llama
# TODO(one-time): replace with the repository's actual license once declared.
License: Copyright © Hugging Face
ShortDescription: Local LLMs, one click away — right from your Windows system tray.
Description: |-
  Llama is a Windows 11 tray app for running llama.cpp models locally — a
